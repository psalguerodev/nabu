name: Catalog guard

# Pre-merge integrity check for service datasheets.
#
# Runs on every PR that touches a datasheet, generated Zod schema, the
# catalog manifest, or the generator/guard tools themselves. Fast — no
# browser, just filesystem checks. Catches drift between a YAML edit and
# its companion Zod / catalog.json entry before it reaches main.
#
# Security: this workflow does NOT consume any untrusted input
# (PR title/body, commit messages, etc.) in run: steps. All commands are
# fixed strings.

on:
  pull_request:
    paths:
      - "runner/lib/services/**"
      - "runner/lib/datasheet.js"
      - "runner/lib/declarative.js"
      - "runner/tools/gen-zod.mjs"
      - "runner/tools/check-catalog.mjs"
      - "mcp/catalog/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Run catalog guard
        run: pnpm -C runner check:catalog
