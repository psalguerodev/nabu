name: Daily catalog health check

# Runs the runner's health probe against the live calculator.aws every
# day at 09:00 UTC. Each service module exports a healthLocators array
# (and optionally a healthPrerequisite function) that the probe uses to
# detect UI drift without actually filling the wizard.

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      services:
        description: "Space-separated services to probe (empty = all)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm -C runner exec playwright install --with-deps chromium

      - name: Run health probe
        id: probe
        env:
          SERVICES: ${{ github.event.inputs.services }}
          NABU_HEALTH_REPORT_DIR: ${{ github.workspace }}/artifacts/health
        run: |
          mkdir -p artifacts/health
          set +e
          # SERVICES comes from env so injection-safe.
          # shellcheck disable=SC2086
          pnpm -C runner health $SERVICES > artifacts/health.ndjson
          probe_exit=$?
          set -e
          tail -n 1 artifacts/health.ndjson > artifacts/health-report.json
          echo "exit_code=$probe_exit" >> "$GITHUB_OUTPUT"
          cat artifacts/health-report.json
          echo "--- per-service ---"
          grep '"type":"service"' artifacts/health.ndjson || true

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: artifacts/

      - name: Open or update degradation issue
        if: steps.probe.outputs.exit_code != '0'
        uses: actions/github-script@v7
        env:
          REPORT_NDJSON_PATH: artifacts/health.ndjson
        with:
          script: |
            const fs = require("fs");
            const path = process.env.REPORT_NDJSON_PATH;
            const lines = fs
              .readFileSync(path, "utf8")
              .split("\n")
              .filter(Boolean)
              .map((l) => JSON.parse(l));
            const services = lines.filter((l) => l.type === "service");
            const report = lines.find((l) => l.type === "report");
            const degraded = services.filter((s) => s.ok === false);
            if (degraded.length === 0) return;

            const today = new Date().toISOString().slice(0, 10);
            const title = `Catalog health: ${degraded.length} service(s) degraded (${today})`;
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            const sections = degraded.map((s) => {
              const header = `### ${s.service}`;
              const reason = s.error
                ? `**Error:** \`${s.error}\``
                : `**Missing locators:**\n${(s.missing ?? [])
                    .map((m) => `- \`${m}\``)
                    .join("\n")}`;
              const inputs = (s.visible_inputs ?? [])
                .slice(0, 30)
                .map((i) => `- \`${i.role}\` · ${i.label}`)
                .join("\n");
              const inputsBlock = inputs
                ? `\n**Currently visible inputs on the wizard** (top 30, for cross-reference):\n${inputs}`
                : "";
              const shot = s.screenshot
                ? `\nScreenshot: \`artifacts/health/${s.service}.png\` (in the run artifacts).`
                : "";
              return `${header}\n${reason}${inputsBlock}${shot}`;
            });
            const body = [
              `Ran at: ${report?.ran_at ?? "?"}`,
              `Total checked: ${report?.total ?? "?"} · ok: ${report?.ok ?? "?"} · degraded: ${report?.degraded ?? "?"}`,
              `Workflow run: ${runUrl}`,
              "",
              "---",
              ...sections,
            ].join("\n");

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "health",
            });
            const ours = existing.find((i) => i.title.startsWith("Catalog health:"));
            if (ours) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ours.number,
                title,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["health"],
              });
            }
