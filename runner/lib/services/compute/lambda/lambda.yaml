# =============================================================================
# AWS Lambda — service datasheet
# =============================================================================
# v0.2.0 — converted from imperative index.js to YAML datasheet. Original
# parameter contract preserved: invocations_per_month, avg_duration_ms,
# memory_mb, architecture. New optional `include_free_tier` (default false)
# replicates the adapter's hardcoded freeTier=false behavior.
#
# v0.3.0 — adds three new pricing surfaces the v0.2 sheet ignored:
#   • Ephemeral storage > 512 MB (on-demand section; AWS bills per-GB-second
#     above the 512 MB default).
#   • Provisioned Concurrency (PC): always-visible section in the wizard,
#     but most callers don't want it; gated behind `pricing_model`
#     (on_demand | provisioned_concurrency). Selecting PC fills the PC
#     section in addition to the on-demand section it shares the wizard
#     with (the calculator sums both — caller's payload should reflect
#     the actual workload split).
#   • SnapStart (Java/Python/.NET runtimes): toggled by `snapstart_enabled`.
#     Gates 3 fields (provisioned hours, cold-starts/restores, memory).
#
# Wizard reality vs the v0.2 comment:
#   The on-demand, Provisioned Concurrency, and SnapStart sections coexist
#   on the same form — there is NO pricing-model radio. The `first: true`
#   anchors on the on-demand fields below pin to the first occurrence of
#   each shared label (Architecture x86, memory_mb Value/Unit); PC and
#   SnapStart are nth=1 and nth=2 of the same labels. We drive PC + SS
#   fields by explicit nth steps below, not by their own `ui:` blocks.
# =============================================================================

service: lambda
version: 0.3.0

meta:
  name: AWS Lambda
  search: Lambda
  config_pattern: "AWS Lambda"
  category: compute
  description: |
    Serverless functions. Covers on-demand invocations (count, duration,
    memory, architecture, ephemeral storage), Provisioned Concurrency
    (concurrency count, hours enabled, requests, duration, memory), and
    SnapStart (hours enabled, cold-start restores, memory).

fields:
  - id: region
    type: string
    required: true
    default: us-east-1
    description: AWS region code.
    ui: { kind: region_modal }

  - id: include_free_tier
    type: enum
    default: without
    description: |
      Free-tier handling. Default "without" matches the v0.1 handler's
      hardcoded freeTier=false and clicks the "Lambda Function - Without
      Free Tier" radio. "include" leaves the wizard's default checked
      radio in place.
    options:
      - { value: include, label: "Lambda Function - Include Free Tier" }
      - { value: without, label: "Lambda Function - Without Free Tier", default: true }
    ui:
      kind: radio_group
      locator: { role: radio }

  - id: architecture
    type: enum
    default: x86_64
    description: Lambda architecture (on-demand section). Wizard default is x86; we only click the dropdown when arm64 is requested.
    options:
      # Wizard listbox shows "x86" (doubled to "x86x86" in CloudScape's
      # first-render trick) and just "Arm" (capitalized, NOT "arm64").
      # option_prefix below covers both shapes.
      - { value: x86_64, label: "x86", default: true }
      - { value: arm64, label: "Arm" }
    ui:
      kind: dropdown
      # `first: true` pins to the on-demand section (PC / SnapStart repeat the field).
      locator: { role: button, name_prefix: "Architecture", first: true }
      # CloudScape doubles the first-rendered option label ("x86x86");
      # starts-with match resolves both that and the single-text "Arm".
      option_prefix: true

  - id: invocations_per_month
    type: integer
    default: 0
    constraints: { min: 0 }
    description: On-demand Lambda invocations per month.
    ui:
      kind: number
      locator: { role: spinbutton, name_prefix: "Number of requests Value", first: true }

  - id: avg_duration_ms
    type: number
    default: 100
    constraints: { min: 1 }
    description: On-demand average duration of each request in milliseconds.
    ui:
      kind: text
      locator: { role: textbox, name_prefix: "Duration of each request (in ms) Enter duration in ms", first: true }

  - id: memory_mb
    type: integer
    default: 128
    constraints: { min: 128, max: 10240 }
    description: On-demand memory allocated per function in MB. Wizard unit dropdown defaults to MB.
    ui:
      kind: number
      locator: { role: spinbutton, name_prefix: "Amount of memory allocated Value", first: true }

  # ---- Ephemeral storage (on-demand section) -----------------------------
  - id: ephemeral_storage_mb
    type: integer
    default: 512
    constraints: { min: 512, max: 10240 }
    description: |
      Ephemeral storage allocated per function (MB). AWS includes 512 MB
      free; values above 512 are billed per-GB-second. The wizard default
      is 512 MB, so we skip the fill entirely when the value equals 512
      to keep the trace clean.
    ui:
      kind: number
      locator: { role: spinbutton, name_prefix: "Amount of ephemeral storage allocated Value", first: true }

  - id: ephemeral_storage_unit
    type: enum
    default: MB
    description: Unit for ephemeral_storage_mb. Wizard default is MB.
    options:
      - { value: MB, label: "MB", default: true }
      - { value: GB, label: "GB" }
    ui:
      kind: dropdown
      locator: { role: button, name_prefix: "Amount of ephemeral storage allocated Unit", first: true }

  # ---- Pricing model (gates Provisioned Concurrency fields) --------------
  - id: pricing_model
    type: enum
    default: on_demand
    description: |
      Selects which billing surface to model. on_demand fills only the
      on-demand section. provisioned_concurrency additionally fills the
      PC section (the wizard keeps both visible and bills the sum;
      callers wanting pure-PC should set invocations_per_month=0).
    options:
      - { value: on_demand, label: "On-Demand", default: true }
      - { value: provisioned_concurrency, label: "Provisioned Concurrency" }
    # No ui: — gate-only field. PC fills are driven by explicit steps below.

  - id: pc_architecture
    type: enum
    default: x86_64
    visible_when: "pricing_model == 'provisioned_concurrency'"
    description: Architecture for the Provisioned Concurrency section.
    options:
      - { value: x86_64, label: "x86", default: true }
      - { value: arm64, label: "arm64" }
    # No ui: — explicit nth dropdown step below (this label collides with on-demand).

  - id: pc_concurrency
    type: integer
    default: 1
    constraints: { min: 1 }
    visible_when: "pricing_model == 'provisioned_concurrency'"
    description: Provisioned Concurrency — number of concurrent executions.
    ui:
      kind: text
      locator: { role: textbox, name: "Concurrency Enter amount" }

  - id: pc_hours_enabled
    type: number
    default: 24
    constraints: { min: 0, max: 24 }
    visible_when: "pricing_model == 'provisioned_concurrency'"
    description: Hours per day Provisioned Concurrency is enabled.
    ui:
      kind: number
      locator: { role: spinbutton, name: "Time for which Provisioned Concurrency is enabled Value" }

  - id: pc_hours_unit
    type: enum
    default: hours
    visible_when: "pricing_model == 'provisioned_concurrency'"
    description: Unit for pc_hours_enabled. Wizard default is "hours".
    options:
      - { value: hours, label: "hours", default: true }
      - { value: minutes, label: "minutes" }
      - { value: seconds, label: "seconds" }
    ui:
      kind: dropdown
      locator: { role: button, name_prefix: "Time for which Provisioned Concurrency is enabled Unit" }

  - id: pc_requests
    type: integer
    default: 0
    constraints: { min: 0 }
    visible_when: "pricing_model == 'provisioned_concurrency'"
    description: Provisioned Concurrency — number of requests served by PC.
    ui:
      kind: number
      locator: { role: spinbutton, name: "Number of requests for Provisioned Concurrency Value" }

  - id: pc_requests_unit
    type: enum
    default: per_month
    visible_when: "pricing_model == 'provisioned_concurrency'"
    description: Unit for pc_requests. Wizard default is "per month".
    options:
      - { value: per_second, label: "per second" }
      - { value: per_minute, label: "per minute" }
      - { value: per_hour,   label: "per hour" }
      - { value: per_day,    label: "per day" }
      - { value: per_month,  label: "per month", default: true }
    ui:
      kind: dropdown
      locator: { role: button, name_prefix: "Number of requests for Provisioned Concurrency Unit" }

  - id: pc_avg_duration_ms
    type: number
    default: 100
    constraints: { min: 1 }
    visible_when: "pricing_model == 'provisioned_concurrency'"
    description: Provisioned Concurrency — average duration of each provisioned request (ms).
    ui:
      kind: text
      locator: { role: textbox, name: "Duration of each provisioned request (in ms) Enter duration in ms" }

  - id: pc_memory_mb
    type: integer
    default: 128
    constraints: { min: 128, max: 10240 }
    visible_when: "pricing_model == 'provisioned_concurrency'"
    description: Provisioned Concurrency — memory allocated (MB). Shares label with on-demand; driven via nth=1.

  - id: pc_memory_unit
    type: enum
    default: MB
    visible_when: "pricing_model == 'provisioned_concurrency'"
    description: Unit for pc_memory_mb. Shares label with on-demand; driven via nth=1.
    options:
      - { value: MB, label: "MB", default: true }
      - { value: GB, label: "GB" }

  # ---- SnapStart (gated by snapstart_enabled) ----------------------------
  - id: snapstart_enabled
    type: boolean
    default: false
    description: |
      Enable SnapStart pricing. SnapStart applies to Java (and newer Python /
      .NET) Lambda runtimes — caches snapshots for fast cold-start. Billed
      for hours enabled + per-restore (cold-start) charge.
    # No ui: — gate-only.

  - id: snapstart_hours_enabled
    type: number
    default: 24
    constraints: { min: 0, max: 24 }
    visible_when: "snapstart_enabled == true"
    description: Hours per day SnapStart is enabled (cache retention window).
    ui:
      kind: number
      locator: { role: spinbutton, name: "Time for which SnapStart is enabled Value" }

  - id: snapstart_hours_unit
    type: enum
    default: hours
    visible_when: "snapstart_enabled == true"
    description: Unit for snapstart_hours_enabled. Wizard default is "hours".
    options:
      - { value: hours, label: "hours", default: true }
      - { value: minutes, label: "minutes" }
      - { value: seconds, label: "seconds" }
    ui:
      kind: dropdown
      locator: { role: button, name_prefix: "Time for which SnapStart is enabled Unit" }

  - id: snapstart_restores
    type: integer
    default: 0
    constraints: { min: 0 }
    visible_when: "snapstart_enabled == true"
    description: Number of SnapStart cold-start restores (per month).
    ui:
      kind: text
      locator: { role: textbox, name: "Number of cold-starts (i.e. SnapStart restores) Enter amount" }

  - id: snapstart_memory_mb
    type: integer
    default: 128
    constraints: { min: 128, max: 10240 }
    visible_when: "snapstart_enabled == true"
    description: Memory allocated for SnapStart functions (MB). Shares label; driven via nth=2.

  - id: snapstart_memory_unit
    type: enum
    default: MB
    visible_when: "snapstart_enabled == true"
    description: Unit for snapstart_memory_mb. Shares label; driven via nth=2.
    options:
      - { value: MB, label: "MB", default: true }
      - { value: GB, label: "GB" }

flow:
  # ---- Free tier + on-demand section ------------------------------------
  - apply: include_free_tier
    when: "include_free_tier == 'without'"

  - apply: architecture
    when: "architecture == 'arm64'"

  - apply: invocations_per_month
    when: "invocations_per_month > 0"

  - apply: avg_duration_ms
    when: "avg_duration_ms > 0"

  - apply: memory_mb
    when: "memory_mb > 0"

  # Skip ephemeral storage fill when at wizard default (512 MB) — keeps the
  # trace clean and avoids re-entering the default value. Unit only fires
  # if caller explicitly switched to GB (default is MB).
  - apply: ephemeral_storage_mb
    when: "ephemeral_storage_mb != 512"
  - apply: ephemeral_storage_unit
    when: "ephemeral_storage_mb != 512 && ephemeral_storage_unit != 'MB'"

  # ---- Provisioned Concurrency section ----------------------------------
  # PC Architecture: same "Architecture x86" label as on-demand; nth=1.
  # The dropdown's selected option text changes to e.g. "Architecture arm64"
  # but the prefix "Architecture" is stable.
  - when: "pricing_model == 'provisioned_concurrency' && pc_architecture == 'arm64'"
    action: select_dropdown
    trigger:
      role: button
      name_prefix: "Architecture"
      nth: 1
    option: "Arm"
    option_prefix: true
    open_wait_ms: 500
    settle_ms: 300

  - apply: pc_concurrency
    when: "pricing_model == 'provisioned_concurrency' && pc_concurrency > 0"

  - apply: pc_hours_enabled
    when: "pricing_model == 'provisioned_concurrency' && pc_hours_enabled > 0"
  - apply: pc_hours_unit
    when: "pricing_model == 'provisioned_concurrency' && pc_hours_enabled > 0 && pc_hours_unit != 'hours'"

  - apply: pc_requests
    when: "pricing_model == 'provisioned_concurrency' && pc_requests > 0"
  - apply: pc_requests_unit
    when: "pricing_model == 'provisioned_concurrency' && pc_requests > 0 && pc_requests_unit != 'per_month'"

  - apply: pc_avg_duration_ms
    when: "pricing_model == 'provisioned_concurrency' && pc_avg_duration_ms > 0"

  # PC memory shares "Amount of memory allocated Value" / "...Unit MB" with
  # on-demand; on-demand is nth=0, PC is nth=1, SnapStart is nth=2.
  - when: "pricing_model == 'provisioned_concurrency' && pc_memory_mb > 0"
    action: fill
    role: spinbutton
    name_prefix: "Amount of memory allocated Value"
    nth: 1
    value: "{pc_memory_mb}"
  - when: "pricing_model == 'provisioned_concurrency' && pc_memory_mb > 0 && pc_memory_unit != 'MB'"
    action: select_dropdown
    trigger:
      role: button
      name_prefix: "Amount of memory allocated Unit"
      nth: 1
    option: "{pc_memory_unit}"
    open_wait_ms: 500
    settle_ms: 300

  # ---- SnapStart section -------------------------------------------------
  - apply: snapstart_hours_enabled
    when: "snapstart_enabled == true && snapstart_hours_enabled > 0"
  - apply: snapstart_hours_unit
    when: "snapstart_enabled == true && snapstart_hours_enabled > 0 && snapstart_hours_unit != 'hours'"

  - apply: snapstart_restores
    when: "snapstart_enabled == true && snapstart_restores > 0"

  # SnapStart memory: nth=2 of the shared "Amount of memory allocated" labels.
  - when: "snapstart_enabled == true && snapstart_memory_mb > 0"
    action: fill
    role: spinbutton
    name_prefix: "Amount of memory allocated Value"
    nth: 2
    value: "{snapstart_memory_mb}"
  - when: "snapstart_enabled == true && snapstart_memory_mb > 0 && snapstart_memory_unit != 'MB'"
    action: select_dropdown
    trigger:
      role: button
      name_prefix: "Amount of memory allocated Unit"
      nth: 2
    option: "{snapstart_memory_unit}"
    open_wait_ms: 500
    settle_ms: 300

  - { action: press_key, key: "Tab" }
  # Lambda recalculation needs >500ms before save; with PC + SnapStart we
  # bump from the legacy 3000ms to the same wait (composite recalc).
  - { action: wait_ms, ms: 3000 }

health_locators:
  # Radio role is stable across platforms.
  - { role: radio, name: "Lambda Function - Without Free Tier", label: "Without Free Tier radio" }
  # CSS for inputs because Chromium's implicit role for these <input>s
  # varies by platform (textbox on Linux, spinbutton on macOS) — the
  # broad aria-label match survives both.
  - { css: 'input[aria-label^="Number of requests Value"]', label: "number of requests input" }
  - { css: 'input[aria-label^="Duration of each request (in ms)"]', label: "duration of each request input" }
  - { css: 'input[aria-label^="Amount of memory allocated Value"]', label: "memory allocated input" }
  - { css: 'input[aria-label^="Amount of ephemeral storage allocated Value"]', label: "ephemeral storage input" }
