# =============================================================================
# Amazon EC2 — service datasheet
# =============================================================================
# Single source of truth for both:
#   - MCP schema (Zod): generated by `pnpm -C runner gen:zod ec2`
#   - Runner navigation: consumed by runner/lib/declarative.js
#
# Discovery source: runner/lib/services/ec2.discovery.md (captured 2026-05-23).
#
# Field shape:
#   - id           : snake_case param name (also the Zod key)
#   - type         : "string" | "integer" | "number" | "boolean" | "enum" | "object" | "array"
#   - default      : initial value (preserves the calculator's UI default)
#   - required     : if true, schema-level required (Zod .min/required)
#   - constraints  : { min, max } for numbers, { pattern } for strings
#   - description  : doc string surfaced to MCP clients
#   - options      : enum values, each { value, label, default? }
#                    where `value` is the wire form (used in JSON) and
#                    `label` is the visible text the wizard renders
#   - ui           : how the runner navigates the form for this field
#                      kind: dropdown | radio | radio_group | checkbox |
#                            number | text | search_table | section_toggle
#                      locator: { role, name | name_prefix, css, first, nth }
#   - visible_when : runner-side guard ("foo == 'bar'") + Zod refinement hint
#   - children     : nested fields (for object types like ebs)
# =============================================================================

service: ec2
version: 0.3.0

meta:
  name: Amazon EC2
  search: EC2
  config_pattern: "Amazon EC2"
  category: compute
  description: |
    Elastic Compute Cloud — virtual servers. The datasheet covers the
    "Constant usage" workload profile; spike-traffic profiles need a
    sub-form editor and are deferred to v0.4.

# -----------------------------------------------------------------------------
# Fields
# -----------------------------------------------------------------------------
fields:

  - id: region
    type: string
    default: us-east-1
    required: true
    description: AWS region code (e.g. us-east-1, eu-west-1).
    ui:
      kind: region_modal
      # region selection is handled by runner/lib/regions.js — declared
      # here so the schema knows about it.

  - id: location_type
    type: enum
    default: region
    description: Calculator location type. Default is Region; the runner only fully supports Region today.
    options:
      - { value: region, label: "Region", default: true }
      - { value: local_zone, label: "Local Zone" }
      - { value: wavelength_zone, label: "Wavelength Zone" }
    ui:
      kind: dropdown
      locator: { role: button, name_prefix: "Choose a location type" }

  - id: tenancy
    type: enum
    default: shared_instances
    description: EC2 tenancy mode.
    options:
      - { value: shared_instances, label: "Shared Instances", default: true }
      - { value: dedicated_instances, label: "Dedicated Instances" }
      - { value: dedicated_hosts, label: "Dedicated Hosts" }
    ui:
      kind: dropdown
      locator: { role: button, name_prefix: "Tenancy" }

  - id: os
    type: enum
    default: linux
    description: Operating system / license bundle that drives per-hour pricing.
    options:
      - { value: linux, label: "Linux", default: true }
      - { value: windows_server, label: "Windows Server" }
      - { value: windows_server_sql_standard, label: "Windows Server with SQL Server Standard" }
      - { value: windows_server_sql_web, label: "Windows Server with SQL Server Web" }
      - { value: windows_server_sql_enterprise, label: "Windows Server with SQL Server Enterprise" }
      - { value: rhel, label: "Red Hat Enterprise Linux" }
      - { value: sles, label: "SUSE Linux Enterprise Server" }
      - { value: linux_sql_standard, label: "Linux with SQL Server Standard" }
      - { value: linux_sql_web, label: "Linux with SQL Server Web" }
      - { value: linux_sql_enterprise, label: "Linux with SQL Server Enterprise" }
      - { value: rhel_ha, label: "Red Hat Enterprise Linux with HA" }
      - { value: rhel_sql_web, label: "Red Hat Enterprise Linux with SQL Server Web" }
      - { value: rhel_sql_standard, label: "Red Hat Enterprise Linux with SQL Server Standard" }
      - { value: rhel_sql_enterprise, label: "Red Hat Enterprise Linux with SQL Server Enterprise" }
      - { value: rhel_ha_sql_standard, label: "Red Hat Enterprise Linux with HA and SQL Server Standard" }
      - { value: rhel_ha_sql_enterprise, label: "Red Hat Enterprise Linux with HA and SQL Server Enterprise" }
      - { value: ubuntu_pro, label: "Ubuntu Pro" }
    ui:
      kind: dropdown
      locator: { role: button, name_prefix: "Operating system" }

  - id: workload
    type: enum
    default: constant
    description: Usage pattern. Only `constant` is fully supported; spike variants reveal a schedule editor we don't model yet.
    options:
      - { value: constant, label: "Constant usage", default: true }
      - { value: daily_spike, label: "Daily spike traffic", unsupported: true }
      - { value: weekly_spike, label: "Weekly spike traffic", unsupported: true }
      - { value: monthly_spike, label: "Monthly spike traffic", unsupported: true }
    ui:
      kind: radio_group
      locator: { role: radio }   # name matches the option label

  - id: count
    type: integer
    default: 1
    required: true
    constraints: { min: 1 }
    description: Number of instances.
    ui:
      kind: number
      locator: { role: spinbutton, name_prefix: "Number of instances" }

  - id: instance_type
    type: string
    required: true
    default: t3.medium
    description: |
      Exact instance name as shown by AWS (e.g. t3.medium, t4g.large, m7a.xlarge,
      c7i.2xlarge). The runner types this into the wizard's search box and
      selects the first matching table row. The name must be specific enough
      that exactly one row remains after the filter.
    constraints:
      pattern: "^[a-z0-9-]+\\.(nano|micro|small|medium|large|metal|[0-9]+x?large)$"
    ui:
      kind: search_table
      locator:
        search: { role: searchbox, name_prefix: "Search instance types" }
        row_css: "table[aria-label='EC2 selection'] tbody input[type='radio']"
      verify_match: true   # post-click: confirm selected row contains instance_type

  # Filters on the instance-selection table. Not user-facing params; the
  # search box does the same job. Documented here for completeness so the
  # runner can use them if a future feature wants explicit filtering.
  - id: filter_instance_family
    type: enum
    optional: true
    advanced: true
    description: Optional pre-filter for the instance table. ~140 families — not enumerated; pass any valid family token (a1, c4..c8i, g3..g7e, hpc6a..hpc8a, i2..i8ge, m4..m8id, p2..p6-b200, r3..r8in, t2..t4g, u-*, x1..x8i, z1d).
    ui:
      kind: dropdown
      locator: { role: button, name_prefix: "Instance family" }

  - id: filter_vcpus
    type: enum
    optional: true
    advanced: true
    description: Optional vCPU count filter.
    options: &vcpus
      - { value: any, label: "Any vCPUs", default: true }
      - { value: "1", label: "1" }
      - { value: "2", label: "2" }
      - { value: "4", label: "4" }
      - { value: "8", label: "8" }
      - { value: "12", label: "12" }
      - { value: "16", label: "16" }
      - { value: "24", label: "24" }
      - { value: "32", label: "32" }
      - { value: "36", label: "36" }
      - { value: "40", label: "40" }
      - { value: "48", label: "48" }
      - { value: "64", label: "64" }
      - { value: "72", label: "72" }
      - { value: "96", label: "96" }
      - { value: "128", label: "128" }
      - { value: "192", label: "192" }
      - { value: "224", label: "224" }
      - { value: "256", label: "256" }
      - { value: "384", label: "384" }
      - { value: "448", label: "448" }
      - { value: "896", label: "896" }
    ui:
      kind: dropdown
      locator: { role: button, name_prefix: "vCPUs" }

  - id: filter_memory_gib
    type: enum
    optional: true
    advanced: true
    description: Optional memory filter (GiB).
    # Truncated — the full list is ~40 specific values. Pass the exact label as the calculator renders it.
    ui:
      kind: dropdown
      locator: { role: button, name_prefix: "Memory (GiB)" }

  - id: filter_network_performance
    type: enum
    optional: true
    advanced: true
    description: Optional network performance filter.
    # Full list is ~30 entries ranging from "Low" / "Low to Moderate" through "Up to N Gigabit" / "N Gigabit" / "N Megabit".
    ui:
      kind: dropdown
      locator: { role: button, name_prefix: "Network performance" }

  # ---------------------------------------------------------------------------
  # Pricing
  # ---------------------------------------------------------------------------
  - id: pricing
    type: enum
    default: on_demand
    description: |
      Pricing strategy. Each value reveals its own sub-section in the wizard:
        - compute_sp / instance_sp: term + payment radios (Savings Plans)
        - on_demand: usage + usage_type
        - spot: discount %
        - reserved_standard / reserved_convertible: hidden under "Other purchasing options" — runner expands first
    options:
      - { value: compute_sp, label: "Compute Savings Plans", nth: 0 }
      - { value: instance_sp, label: "EC2 Instance Savings Plans", nth: 1 }
      - { value: on_demand, label: "On-Demand", default: true }
      - { value: spot, label: "Spot Instances" }
      - { value: reserved_standard, label: "Standard Reserved Instances", nth: 2, behind_expand: "other_purchasing_options" }
      - { value: reserved_convertible, label: "Convertible Reserved Instances", nth: 3, behind_expand: "other_purchasing_options" }
    ui:
      kind: radio
      locator: { role: radio }

  - id: pricing_term
    type: enum
    default: 3y
    visible_when: "pricing == 'compute_sp' || pricing == 'instance_sp' || pricing == 'reserved_standard' || pricing == 'reserved_convertible'"
    description: Commitment term for Savings Plans / Reserved Instances.
    options:
      - { value: 1y, label: "1 year" }
      - { value: 3y, label: "3 year", default: true }
    ui:
      kind: radio
      # nth resolved at runtime from pricing.options[].nth

  - id: pricing_payment
    type: enum
    default: no_upfront
    visible_when: "pricing == 'compute_sp' || pricing == 'instance_sp' || pricing == 'reserved_standard' || pricing == 'reserved_convertible'"
    description: Upfront payment posture.
    options:
      - { value: no_upfront, label: "No upfront", default: true }
      - { value: partial_upfront, label: "Partial upfront" }
      - { value: all_upfront, label: "All upfront" }
    ui:
      kind: radio

  - id: usage
    type: number
    optional: true
    visible_when: "pricing == 'on_demand'"
    constraints: { min: 0 }
    description: Usage amount; meaning depends on usage_type (% of month, hours/day, hours/week, hours/month).
    ui:
      kind: number
      locator: { role: spinbutton, name: "Usage" }

  - id: usage_type
    type: enum
    default: utilization_pct
    visible_when: "pricing == 'on_demand'"
    description: Unit for the `usage` field.
    options:
      - { value: utilization_pct, label: "Utilization percent per month", default: true }
      - { value: hours_per_day, label: "Hours / Day" }
      - { value: hours_per_week, label: "Hours / Week" }
      - { value: hours_per_month, label: "Hours / Month" }
    ui:
      kind: dropdown
      locator: { role: button, name_prefix: "Usage type" }

  - id: hours_per_month
    type: number
    optional: true
    legacy: true
    description: |
      Legacy v0.1 param. When set and != 730, the handler treats it as
      `usage_type = hours_per_month` with `usage = hours_per_month`.
    constraints: { min: 0, max: 744 }

  - id: spot_discount_pct
    type: number
    optional: true
    visible_when: "pricing == 'spot'"
    constraints: { min: 0, max: 100 }
    description: Assumed % discount vs On-Demand for Spot pricing modeling.
    ui:
      kind: number
      locator: { role: spinbutton, name_prefix: "Assume percentage discount" }

  # ---------------------------------------------------------------------------
  # Optional sections (collapsed by default — runner expands when needed)
  # ---------------------------------------------------------------------------

  - id: monitoring
    type: boolean
    default: false
    description: Toggle CloudWatch detailed monitoring (paid).
    ui:
      kind: checkbox
      section_toggle: { role: button, name_prefix: "Detailed monitoring - optional" }
      locator: { role: checkbox, name: "Enable monitoring" }

  - id: ebs
    type: object
    optional: true
    description: Per-instance EBS volume attached to each EC2 in this line item.
    ui:
      kind: section
      section_toggle: { role: button, name_prefix: "Amazon Elastic Block Store (EBS) - optional" }
    children:
      - id: volume_type
        type: enum
        default: gp3
        description: EBS volume type.
        options:
          - { value: gp3, label: "General Purpose SSD (gp3)", default: true }
          - { value: gp2, label: "General Purpose SSD (gp2)" }
          - { value: io1, label: "Provisioned IOPS SSD (io1)" }
          - { value: io2, label: "Provisioned IOPS SSD (io2)" }
          - { value: st1, label: "Throughput Optimized HDD (st 1)" }
          - { value: sc1, label: "Cold HDD (sc1)" }
          - { value: magnetic, label: "Magnetic (previous generation)" }
        ui:
          kind: dropdown
          locator: { role: button, name_prefix: "Storage for each EC2 instance" }

      - id: storage_gb
        type: number
        default: 30
        constraints: { min: 1 }
        description: Storage amount in GB per volume.
        ui:
          kind: number
          locator: { role: spinbutton, name: "Storage amount Value" }

      - id: storage_unit
        type: enum
        default: GB
        options:
          - { value: MB, label: "MB" }
          - { value: GB, label: "GB", default: true }
          - { value: TB, label: "TB" }
        ui:
          kind: dropdown
          locator: { role: button, name_prefix: "Unit Storage amount" }

      - id: iops
        type: integer
        optional: true
        visible_when: "volume_type == 'gp3' || volume_type == 'io1' || volume_type == 'io2'"
        constraints: { min: 100 }
        description: Provisioned IOPS per volume (gp3/io1/io2 only).
        ui:
          kind: number
          locator: { role: textbox, name_prefix: "IOPS" }

      - id: throughput_mbps
        type: integer
        optional: true
        visible_when: "volume_type == 'gp3'"
        constraints: { min: 125 }
        description: Provisioned throughput in MBps (gp3 only).
        ui:
          kind: number
          locator: { role: spinbutton, name_prefix: "Throughput Value" }

      - id: snapshot_frequency
        type: enum
        default: none
        options:
          - { value: none, label: "No snapshot storage", default: true }
          - { value: hourly, label: "Hourly" }
          - { value: daily, label: "Daily" }
          - { value: "2x_daily", label: "2x Daily" }
          - { value: "3x_daily", label: "3x Daily" }
          - { value: "4x_daily", label: "4x Daily" }
          - { value: "6x_daily", label: "6x Daily" }
          - { value: weekly, label: "Weekly" }
          - { value: monthly, label: "Monthly" }
        ui:
          kind: dropdown
          locator: { role: button, name_prefix: "Snapshot Frequency" }

  - id: data_transfer
    type: object
    optional: true
    unsupported: true   # repeating row pattern — interpreter primitive landing in v0.4
    description: |
      Inbound + outbound data transfer rows. Inbound is free (Internet or
      All other regions). Outbound destinations are a long region list with
      embedded prices.
    ui:
      kind: section
      section_toggle: { role: button, name_prefix: "Data transfer - optional" }
    children:
      - id: inbound
        type: array
        item:
          amount: { type: number, constraints: { min: 0 } }
          unit: { type: enum, options: [GB_per_month, TB_per_month], default: TB_per_month }
          source: { type: enum, options: [internet_free, all_other_regions_free], default: internet_free }
      - id: outbound
        type: array
        item:
          amount: { type: number, constraints: { min: 0 } }
          unit: { type: enum, options: [GB_per_month, TB_per_month], default: TB_per_month }
          destination: { type: string, description: "Destination label as rendered (e.g. 'Internet', 'All other regions', a specific region name)." }

  - id: additional_cost
    type: number
    optional: true
    constraints: { min: 0 }
    description: Free-form add-on cost (e.g. third-party license per month).
    ui:
      kind: number
      section_toggle: { role: button, name_prefix: "Additional costs - optional" }
      locator: { role: textbox, name_prefix: "Enter any placeholder cost" }

# -----------------------------------------------------------------------------
# Flow — execution order for the runner
# -----------------------------------------------------------------------------
# Each entry either:
#   - applies a field (the runner derives the action from field.ui.kind), OR
#   - injects a primitive (wait_ms, scroll, press_key, expand_section,
#     verify_text)
# Conditionals via `when` (same mini-expression language as v0.2 schema).
# -----------------------------------------------------------------------------
flow:

  # Region modal is driven by runner/lib/regions.js — runner handles it
  # outside the declarative flow (preserves v0.1 behavior).

  - apply: tenancy
    when: "tenancy != 'shared_instances'"

  - apply: os
    when: "os != 'linux'"

  - apply: count

  - apply: instance_type

  - { action: scroll, dy: 500 }
  - { action: wait_ms, ms: 500 }

  # ----- pricing -----
  # Reserved options live behind "Other purchasing options" — expand first.
  - action: expand_section
    role: button
    name: { regex: "^Other purchasing options" }
    when: "pricing == 'reserved_standard' || pricing == 'reserved_convertible'"

  - apply: pricing

  - apply: pricing_term
    when: "pricing == 'compute_sp' || pricing == 'instance_sp' || pricing == 'reserved_standard' || pricing == 'reserved_convertible'"

  - apply: pricing_payment
    when: "pricing == 'compute_sp' || pricing == 'instance_sp' || pricing == 'reserved_standard' || pricing == 'reserved_convertible'"

  - apply: usage
    when: "pricing == 'on_demand' && usage != null"

  - apply: usage_type
    when: "pricing == 'on_demand' && usage_type != 'utilization_pct'"

  - apply: spot_discount_pct
    when: "pricing == 'spot' && spot_discount_pct != null"

  # Legacy bridge: if old jobs pass hours_per_month=730 (no-op) or other values,
  # convert to usage + usage_type=hours_per_month.
  - action: fill_if_visible
    role: spinbutton
    name: { regex: "Utilization|Hours per month|hrs\\/mo", flags: "i" }
    first: true
    value: "{hours_per_month}"
    when: "hours_per_month != null && hours_per_month != 730"

  # ----- detailed monitoring -----
  - action: expand_section
    role: button
    name: { regex: "^Detailed monitoring - optional" }
    when: "monitoring == true"

  - apply: monitoring
    when: "monitoring == true"

  # ----- ebs -----
  - action: expand_section
    role: button
    name: { regex: "^Amazon Elastic Block Store \\(EBS\\) - optional" }
    when: "ebs != null"

  - apply: ebs.volume_type
    when: "ebs != null && ebs.volume_type != null"

  - apply: ebs.storage_gb
    when: "ebs != null && ebs.storage_gb != null"

  - apply: ebs.iops
    when: "ebs != null && ebs.iops != null && (ebs.volume_type == 'gp3' || ebs.volume_type == 'io1' || ebs.volume_type == 'io2')"

  - apply: ebs.throughput_mbps
    when: "ebs != null && ebs.throughput_mbps != null && ebs.volume_type == 'gp3'"

  - apply: ebs.snapshot_frequency
    when: "ebs != null && ebs.snapshot_frequency != null && ebs.snapshot_frequency != 'none'"

  # ----- additional cost -----
  - action: expand_section
    role: button
    name: { regex: "^Additional costs - optional" }
    when: "additional_cost != null"

  - apply: additional_cost
    when: "additional_cost != null"

# -----------------------------------------------------------------------------
# Health locators — daily drift check
# -----------------------------------------------------------------------------
health_locators:
  - { role: spinbutton, name: { regex: "Number of instances" }, label: "instances spinbutton" }
  - { role: searchbox, name: { regex: "Search instance types" }, label: "instance type searchbox" }
  - { css: "table[aria-label='EC2 selection']", label: "instance selection table" }
  - { role: radio, name: "On-Demand", label: "On-Demand pricing radio" }
