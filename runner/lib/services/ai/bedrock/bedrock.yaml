# =============================================================================
# Amazon Bedrock — service datasheet
# =============================================================================
# v0.3.0 — BREAKING rewrite for the redesigned Bedrock wizard.
#
# The legacy form had one "model picker" dropdown per provider section. That
# control is GONE. The new wizard replaces it with two per-provider dropdowns:
#
#   "Select your inference route" / "Select the inference route"   →  inference_route
#   "Select your inference type"  / "Select the inference type"    →  inference_type
#
# plus two new Yes/No dropdowns inside each provider's "Model Settings" panel:
#
#   "Do you want to estimate with image as input?"                 →  image_input
#   "Do you want to estimate with prompt caching enabled?"         →  prompt_caching
#
# The four token-volume textboxes survived unchanged.
#
# ----- Per-provider asymmetries discovered in calculator.aws -----------------
#
# 1) Label wording differs by provider section:
#      Amazon, Meta, etc. → "Select your inference route/type ..."
#      Anthropic          → "Select the inference route/type ..."
#    We use a regex `^Select (your|the) inference route` to match either.
#
# 2) Inference route options vary per provider:
#      Amazon:    "Geo Cross Region Inference", "In-Region"          (default GCR)
#      Anthropic: "Global", "Geo Cross Region Inference", "In Region" (default Global)
#    The YAML exposes the union as a free-form string (interpolated into a
#    raw select_dropdown step) so the caller passes the exact wizard label
#    matching their provider. Unknown values fail at click time with a clear
#    Playwright option-not-found error.
#
# 3) Inference type options vary per provider:
#      Amazon:    "On Demand - Standard", "On Demand - Priority",
#                 "On Demand - Flex", "Batch"
#      Anthropic: "On Demand - Standard", "Batch"
#      Meta:      "On Demand - Standard", "Batch"
#    Same free-form-string treatment as above.
#
# 4) Image input + prompt caching render as CloudScape select buttons whose
#    accessible name is the FULL question text. Yes/No appear as listbox
#    options. Treated here as booleans → mapped to "Yes" / "No" via a raw
#    select_dropdown step (not the auto-emitted `checkbox` kind, because they
#    aren't checkboxes in the DOM).
#
# 5) Disabled providers in the wizard today (greyed checkboxes): AI21 Labs,
#    Cohere, LumaAI, StabilityAI. Schema omits them.
#
# ----- Locator notes ---------------------------------------------------------
#
# Provider checkboxes have no accessible name on the input itself, but the
# CloudScape Checkbox component wraps the native input in a span carrying
# a stable `data-id` attribute keyed by provider:
#
#   amazon, anthropic, deepseek, meta, mistral, openAi, qwen, twelveLabs,
#   writer, ai21, cohere, lumaAi, stabilityAi  (note camelCase variants).
#
# We target `[data-id="<id>"] input[type="checkbox"]` — precise, single-
# match, no geometric guessing. The legacy
# `input[type="checkbox"]:not([disabled]):near(:text-is("..."))` locator
# from v0.2.x is DROPPED because the new wizard's 9-column provider grid
# puts neighbouring providers close enough that `:near("Amazon")`
# resolved to both the Amazon AND DeepSeek inputs, triggering Playwright
# strict-mode violations. role-based `getByRole('checkbox', name)` also
# fails: it finds the input, but a sibling span with class `...prevented`
# intercepts pointer events, so the click never lands.
#
# Going through the `data-id` wrapper is also resilient to label rename
# (e.g. "OpenAI" vs "OpenAi") which has happened on this wizard before.
#
# ----- Single-provider scope cut --------------------------------------------
#
# Like v0.2.x, we model ONE active provider at a time. Each provider section
# duplicates all 6 controls (route + type + 4 textboxes + 2 toggles), and the
# interpreter's `fill` is strict-mode (no auto-`.first()`). We always flip
# every other available provider OFF to leave exactly one usage block on
# screen at fill time. Multi-provider estimates require multiple service
# entries.
#
# ----- Defaults preserved ----------------------------------------------------
# provider=Anthropic, requests_per_minute=0, hours_per_day=24,
# input_tokens=1000, output_tokens=500. inference_route + inference_type
# default to the wizard's first option for the default provider.
# =============================================================================

service: bedrock
version: 0.3.0

meta:
  name: Amazon Bedrock
  search: Bedrock
  config_pattern: "Amazon Bedrock"
  category: ai
  description: |
    Foundation-model pricing. Pick a provider, an inference route + type for
    that provider, then describe traffic via requests/min, daily runtime
    hours, and input/output tokens per request. Optional toggles for image
    input and prompt caching.

fields:
  - id: region
    type: string
    required: true
    default: us-east-1
    description: AWS region code.
    ui: { kind: region_modal }

  - id: provider
    type: enum
    default: Anthropic
    description: |
      Foundation-model provider. The wizard renders one usage block per
      enabled provider; this datasheet activates exactly one block at a time
      so the shared textbox labels stay strict-mode-safe. Disabled providers
      (AI21 Labs, Cohere, LumaAI, StabilityAI) are omitted.
    options:
      - { value: Amazon,     label: "Amazon" }
      - { value: Anthropic,  label: "Anthropic", default: true }
      - { value: DeepSeek,   label: "DeepSeek" }
      - { value: Meta,       label: "Meta" }
      - { value: Mistral,    label: "Mistral" }
      - { value: OpenAI,     label: "OpenAI" }
      - { value: Qwen,       label: "Qwen" }
      - { value: TwelveLabs, label: "TwelveLabs" }
      - { value: Writer,     label: "Writer" }
    # No `ui:` block — provider drives explicit check_checkbox steps below
    # (Playwright CSS `:near` pseudo) rather than a single auto-emitted
    # step, because each provider needs its own toggle line and we want to
    # disable all the others in one pass.

  - id: inference_route
    type: string
    optional: true
    description: |
      Exact wizard label of the inference route to select (case-insensitive
      anchored match). Provider-dependent options:
        Amazon:    "Geo Cross Region Inference" | "In-Region"
        Anthropic: "Global" | "Geo Cross Region Inference" | "In Region"
      Leave null to keep the wizard default for the chosen provider
      ("Geo Cross Region Inference" for Amazon, "Global" for Anthropic).

  - id: inference_type
    type: string
    optional: true
    description: |
      Exact wizard label of the inference type (case-insensitive anchored
      match). Provider-dependent options:
        Amazon:    "On Demand - Standard" | "On Demand - Priority"
                 | "On Demand - Flex" | "Batch"
        Anthropic / Meta: "On Demand - Standard" | "Batch"
      Leave null to keep the wizard default ("On Demand - Standard").

  - id: image_input
    type: boolean
    default: false
    description: |
      Estimate with image as input. Renders as a Yes/No CloudScape select
      (not a checkbox), so driven by a raw select_dropdown step that maps
      true→"Yes", false→"No". Set this only when the chosen model actually
      accepts image input — the wizard will silently ignore it otherwise.

  - id: prompt_caching
    type: boolean
    default: false
    description: |
      Estimate with prompt caching enabled. Same Yes/No CloudScape select
      pattern as image_input.

  - id: requests_per_minute
    type: number
    default: 0
    constraints: { min: 0 }
    description: Average requests per minute.
    ui:
      kind: text
      locator: { role: textbox, name: "Average requests per minute", first: true }

  - id: hours_per_day
    type: number
    default: 24
    constraints: { min: 0, max: 24 }
    description: Hours per day at the above request rate.
    ui:
      kind: text
      locator: { role: textbox, name: "Hours per day at this rate", first: true }

  - id: input_tokens_per_request
    type: integer
    default: 1000
    constraints: { min: 0 }
    description: Average input tokens per request.
    ui:
      kind: text
      locator: { role: textbox, name: "Average input tokens per request", first: true }

  - id: output_tokens_per_request
    type: integer
    default: 500
    constraints: { min: 0 }
    description: Average output tokens per request.
    ui:
      kind: text
      locator: { role: textbox, name: "Average output tokens per request", first: true }

flow:
  # ----- Provider selection ------------------------------------------------
  # Activate exactly one provider checkbox; flip Amazon (the wizard's
  # default-on provider) OFF when caller picked something else. Other
  # non-default providers don't need an explicit "false" branch because
  # they start unchecked and we only activate one at a time.
  # check_checkbox is idempotent so re-running with the same desired
  # state is a no-op. See header note for why we target the data-id
  # wrapper rather than the input directly.
  # `force: true`: the sibling span (`...prevented` class) intercepts
  # pointer events so Playwright's actionability gate blocks the click;
  # force-clicking bypasses it. The native input still receives the
  # click via Playwright's input-dispatch path.
  - when: "provider == 'Amazon'"
    action: check_checkbox
    css: '[data-id="amazon"] input[type="checkbox"]'
    value: true
    force: true
  - when: "provider != 'Amazon'"
    action: check_checkbox
    css: '[data-id="amazon"] input[type="checkbox"]'
    value: false
    force: true

  - when: "provider == 'Anthropic'"
    action: check_checkbox
    css: '[data-id="anthropic"] input[type="checkbox"]'
    value: true
    force: true

  - when: "provider == 'DeepSeek'"
    action: check_checkbox
    css: '[data-id="deepseek"] input[type="checkbox"]'
    value: true
    force: true

  - when: "provider == 'Meta'"
    action: check_checkbox
    css: '[data-id="meta"] input[type="checkbox"]'
    value: true
    force: true

  - when: "provider == 'Mistral'"
    action: check_checkbox
    css: '[data-id="mistral"] input[type="checkbox"]'
    value: true
    force: true

  - when: "provider == 'OpenAI'"
    action: check_checkbox
    css: '[data-id="openAi"] input[type="checkbox"]'
    value: true
    force: true

  - when: "provider == 'Qwen'"
    action: check_checkbox
    css: '[data-id="qwen"] input[type="checkbox"]'
    value: true
    force: true

  - when: "provider == 'TwelveLabs'"
    action: check_checkbox
    css: '[data-id="twelveLabs"] input[type="checkbox"]'
    value: true
    force: true

  - when: "provider == 'Writer'"
    action: check_checkbox
    css: '[data-id="writer"] input[type="checkbox"]'
    value: true
    force: true

  # The provider grid re-renders the per-provider dropdowns/selects after
  # toggle. 1500ms was not enough for the newly-enabled section's options
  # to be selectable; bump to 3000ms.
  - { action: wait_ms, ms: 3000 }

  # ----- Inference route ---------------------------------------------------
  # Trigger button text differs per provider section:
  #   Amazon/Meta/... → "Select your inference route ..."
  #   Anthropic        → "Select the inference route ..."
  # Single regex covers both wordings. `first: true` because with only one
  # provider active there is exactly one match anyway, but the flag keeps
  # the locator strict-safe if a future rev leaves another section visible.
  - when: "inference_route != null"
    action: select_dropdown
    trigger:
      role: button
      name: { regex: "^Select (your|the) inference route", flags: "i" }
      first: true
    option: "{inference_route}"
    option_prefix: true   # CloudScape renders the selected option doubled (e.g. "GlobalGlobal")
    open_wait_ms: 1000
    settle_ms: 500

  # ----- Inference type ----------------------------------------------------
  - when: "inference_type != null"
    action: select_dropdown
    trigger:
      role: button
      name: { regex: "^Select (your|the) inference type", flags: "i" }
      first: true
    option: "{inference_type}"
    option_prefix: true
    open_wait_ms: 1000
    settle_ms: 500

  # ----- Image input toggle ------------------------------------------------
  # Yes/No CloudScape select. Default wizard value is "No"; only emit when
  # the caller wants "Yes" to avoid an unnecessary click.
  - when: "image_input == true"
    action: select_dropdown
    trigger:
      role: button
      name: { regex: "^Do you want to estimate with image as input\\?", flags: "i" }
      first: true
    option: "Yes"
    option_prefix: true
    open_wait_ms: 800
    settle_ms: 400

  # ----- Prompt caching toggle --------------------------------------------
  - when: "prompt_caching == true"
    action: select_dropdown
    trigger:
      role: button
      name: { regex: "^Do you want to estimate with prompt caching enabled\\?", flags: "i" }
      first: true
    option: "Yes"
    option_prefix: true
    open_wait_ms: 800
    settle_ms: 400

  # ----- Traffic shape -----------------------------------------------------
  # Each fill guarded by `> 0` (legacy skip-zero behavior). hours_per_day
  # default is 24, so always applied unless explicitly set to 0.
  - apply: requests_per_minute
    when: "requests_per_minute > 0"
  - apply: hours_per_day
    when: "hours_per_day > 0"
  - apply: input_tokens_per_request
    when: "input_tokens_per_request > 0"
  - apply: output_tokens_per_request
    when: "output_tokens_per_request > 0"

  - { action: press_key, key: "Tab" }
  # 3000ms: token-pricing recalc spans 6+ inputs + route/type lookups; mirror
  # the recalc-heavy precedent (dynamodb / lambda) so total cost settles
  # before "Save and add service" fires.
  - { action: wait_ms, ms: 3000 }

# Amazon is the wizard default with its usage block visible immediately, so
# no health prerequisite is required: the inference-route + inference-type
# buttons and the four token-volume textboxes are all on screen at probe
# time.
health_locators:
  - { role: button,  name: { regex: "^Select (your|the) inference route", flags: "i" }, label: "inference route dropdown" }
  - { role: button,  name: { regex: "^Select (your|the) inference type",  flags: "i" }, label: "inference type dropdown" }
  - { role: textbox, name: "Average requests per minute",       label: "requests per minute textbox" }
  - { role: textbox, name: "Hours per day at this rate",        label: "hours per day textbox" }
  - { role: textbox, name: "Average input tokens per request",  label: "input tokens textbox" }
  - { role: textbox, name: "Average output tokens per request", label: "output tokens textbox" }
