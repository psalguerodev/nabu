extends: ../_base.yaml

service: sagemaker-on-demand-notebooks
version: 0.2.0

meta:
  description: SageMaker On-Demand Notebook Instances.

activates:
  sageMakerStudioNotebooks: false
  sageMakerOnDemandNotebookInstances: true

ready_text: "On-Demand Notebook hour"

fields:
  - id: data_scientists
    type: integer
    description: Number of data scientists using the notebook service.
    default: 1
    constraints: { min: 1 }
    ui:
      kind: number
      locator: { role: textbox, name_prefix: "Number of data scientist(s)" }

  - id: instances_per_scientist
    type: integer
    default: 1
    constraints: { min: 1 }
    ui:
      kind: number
      locator: { role: textbox, name_prefix: "Number of On-Demand Notebook instances per data scientist" }

  - id: hours_per_day
    type: number
    description: Hours per day the endpoint is active.
    default: 8
    constraints: { min: 0, max: 24 }
    ui:
      kind: number
      locator: { role: textbox, name_prefix: "On-Demand Notebook hour(s) per day" }

  - id: days_per_month
    type: number
    description: Days per month the endpoint is active.
    default: 22
    constraints: { min: 0, max: 31 }
    ui:
      kind: number
      locator: { role: textbox, name_prefix: "On-Demand Notebook day(s) per month" }

  - id: instance_type
    type: string
    description: Exact SageMaker instance type (ml.* identifier).
    default: ml.t3.medium
    ui:
      kind: combobox
      locator: { role: combobox, name: "Select an instance" }

  - id: storage_amount_gb
    type: number
    description: EBS storage attached to each endpoint instance (GB).
    default: 50
    constraints: { min: 0 }
    ui:
      kind: number
      locator: { role: spinbutton, name: "Storage amount Value" }

flow:
  - apply: data_scientists
  - apply: instances_per_scientist
  - apply: hours_per_day
  - apply: days_per_month
  - apply: instance_type
  - apply: storage_amount_gb

health_locators:
  - { role: textbox, name: { regex: "Number of data scientist\\(s\\)" }, label: "data scientists textbox" }
  - { role: textbox, name: { regex: "Number of On-Demand Notebook instances per data scientist" }, label: "instances per scientist textbox" }
  - { role: textbox, name: { regex: "On-Demand Notebook hour\\(s\\) per day" }, label: "hours per day textbox" }
  - { role: textbox, name: { regex: "On-Demand Notebook day\\(s\\) per month" }, label: "days per month textbox" }
  - { role: combobox, name: "Select an instance", label: "instance type combobox" }
