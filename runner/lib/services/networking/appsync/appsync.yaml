# =============================================================================
# AWS AppSync — service datasheet
# =============================================================================
# Two feature toggles (Real-Time, Data Transfer) gate sub-sections. The
# imperative handler's verify-retry checkbox helper maps to the interpreter's
# `check_checkbox` primitive which is idempotent.
#
# Gotcha preserved: `Number Of Subscribed Clients` is a TEXTBOX while
# sibling Real-Time fields are spinbuttons (caught by the AppSync entry in
# the skill's gotcha table).
# =============================================================================

service: appsync
version: 0.2.0

meta:
  name: AWS AppSync
  search: AppSync
  config_pattern: "AWS AppSync"
  category: networking
  description: |
    GraphQL API requests + optional Real-Time subscriptions (with
    subscribed-clients + duration + in/out message counts) + optional
    Data Transfer feature.

fields:
  - id: region
    type: string
    required: true
    default: us-east-1
    description: AWS region code.
    ui: { kind: region_modal }

  - id: enable_real_time
    type: boolean
    default: false
    description: Enables the AppSync GraphQL Real-Time feature checkbox and exposes its 4 sub-fields.
    ui:
      kind: checkbox
      locator: { role: checkbox, name: "AppSync GraphQL Real-Time" }

  - id: enable_data_transfer
    type: boolean
    default: false
    description: Enables the AppSync Data Transfer feature checkbox.
    ui:
      kind: checkbox
      locator: { role: checkbox, name: "Appsync Data Transfer" }

  - id: api_requests_per_month
    type: integer
    default: 0
    constraints: { min: 0 }
    description: Number of GraphQL API requests per month.
    ui:
      kind: number
      locator: { role: spinbutton, name: { regex: "Number of API Requests" } }

  # Real-Time sub-fields — only visible when enable_real_time is checked.
  - id: subscribed_clients
    type: integer
    default: 100
    constraints: { min: 0 }
    visible_when: "enable_real_time == true"
    description: Number of subscribed clients (rendered as a textbox, not a spinbutton).
    ui:
      kind: text
      locator: { role: textbox, name: { regex: "Number Of Subscribed Clients" } }

  - id: real_time_avg_duration_minutes
    type: number
    default: 0
    constraints: { min: 0 }
    visible_when: "enable_real_time == true"
    description: Average active duration per subscribed client (minutes).
    ui:
      kind: number
      locator: { role: spinbutton, name: { regex: "Average Active Duration per Subscribed Clients" } }

  - id: inbound_messages_per_month
    type: integer
    default: 0
    constraints: { min: 0 }
    visible_when: "enable_real_time == true"
    description: Number of inbound messages per month.
    ui:
      kind: number
      locator: { role: spinbutton, name: { regex: "Number of Inbound Messages" } }

  - id: outbound_messages_per_month
    type: integer
    default: 0
    constraints: { min: 0 }
    visible_when: "enable_real_time == true"
    description: Number of outbound messages per month.
    ui:
      kind: number
      locator: { role: spinbutton, name: { regex: "Number of Outbound Messages" } }

flow:
  # check_checkbox hardcodes desired state = true, so we apply only when
  # the user wants the feature ON. Both AppSync feature checkboxes default
  # to UNCHECKED in the wizard, so skipping the click leaves them off —
  # matching `enable_*: false`.
  - apply: enable_real_time
    when: "enable_real_time == true"
  - apply: enable_data_transfer
    when: "enable_data_transfer == true"

  - apply: api_requests_per_month
    when: "api_requests_per_month > 0"

  - apply: subscribed_clients
    when: "enable_real_time == true"

  - apply: real_time_avg_duration_minutes
    when: "enable_real_time == true && real_time_avg_duration_minutes > 0"

  - apply: inbound_messages_per_month
    when: "enable_real_time == true && inbound_messages_per_month > 0"

  - apply: outbound_messages_per_month
    when: "enable_real_time == true && outbound_messages_per_month > 0"

  - { action: press_key, key: "Tab" }
  - { action: wait_ms, ms: 500 }

health_locators:
  - { role: checkbox, name: "AppSync GraphQL Real-Time", label: "Real-Time feature checkbox" }
  - { role: checkbox, name: "Appsync Data Transfer", label: "Data Transfer feature checkbox" }
  - { role: spinbutton, name: { regex: "Number of API Requests" }, label: "API requests spinbutton" }
