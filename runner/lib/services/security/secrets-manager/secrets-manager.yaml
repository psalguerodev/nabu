# =============================================================================
# AWS Secrets Manager — service datasheet
# =============================================================================
# Migrated from the imperative security/secrets-manager/index.js handler
# (v0.1.1). Three scalar inputs:
#   - Number of secrets
#   - Average duration of each secret (days)
#   - Number of API calls per month
#
# Scope-cut from v0.1: the legacy handler switched the duration unit
# dropdown from "days" to "months" when avg_secret_duration_days > 30.42,
# rewriting the value via division. The datasheet interpreter has no
# arithmetic primitive, so we constrain the input to 1-30 days and lean
# on the schema to surface the cap. Long-retention scenarios should
# bucket secrets into multiple groups or be modeled out-of-band.
# =============================================================================

service: secrets-manager
version: 0.2.0

meta:
  name: AWS Secrets Manager
  search: Secrets Manager
  config_pattern: "AWS Secrets Manager"
  category: security
  description: |
    Secrets Manager pricing — per-secret storage (prorated by average
    duration in days, max 30) plus per-10k-API-call charges.

fields:
  - id: region
    type: string
    required: true
    default: us-east-1
    description: AWS region code.
    ui: { kind: region_modal }

  - id: number_of_secrets
    type: integer
    default: 0
    constraints: { min: 0 }
    description: Number of secrets stored.
    ui:
      kind: text
      locator: { role: textbox, name: { regex: "Number of secrets" } }

  - id: avg_secret_duration_days
    type: integer
    default: 30
    constraints: { min: 1, max: 30 }
    description: |
      Average lifetime of each secret in days (1-30). The calculator's
      days unit caps at 30; longer retentions are out of scope for this
      datasheet (see file header).
    ui:
      kind: number
      locator: { role: spinbutton, name: { regex: "Average duration of each secret" } }

  - id: api_calls_per_month
    type: integer
    default: 0
    constraints: { min: 0 }
    description: Number of API calls per month.
    ui:
      kind: number
      locator: { role: spinbutton, name: { regex: "Number of API calls" } }

flow:
  - apply: number_of_secrets
    when: "number_of_secrets > 0"
  - apply: avg_secret_duration_days
    when: "avg_secret_duration_days != 30"
  - apply: api_calls_per_month
    when: "api_calls_per_month > 0"
  - { action: press_key, key: "Tab" }
  - { action: wait_ms, ms: 500 }

health_locators:
  - { role: textbox, name: { regex: "Number of secrets" }, label: "number of secrets textbox" }
  - { role: spinbutton, name: { regex: "Average duration of each secret" }, label: "average secret duration spinbutton" }
  - { role: spinbutton, name: { regex: "Number of API calls" }, label: "API calls spinbutton" }
